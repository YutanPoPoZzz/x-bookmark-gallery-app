<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xブックマーク画像ギャラリー</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #14161a; --card: #1a1d22; --ink: #e9ebee;
    --sub: #8a919c; --line: #262a31; --accent: #4bb3c9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px 8px;
  }
  .title { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 8px; }
  .title h1 { font-size: 1.02rem; margin: 0; letter-spacing: .01em; }
  .title .updated { color: var(--sub); font-size: .74rem; }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  #tabs button {
    background: var(--panel); color: var(--sub);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; font-size: .82rem; cursor: pointer;
    font-family: inherit; transition: background .12s, color .12s, border-color .12s;
  }
  #tabs button:hover { color: var(--ink); }
  #tabs button.on { background: var(--accent); color: #04252c; border-color: var(--accent); font-weight: 700; }
  main { padding: 8px; }
  #grid { columns: 5; column-gap: 6px; }
  @media (max-width: 1100px) { #grid { columns: 4; } }
  @media (max-width: 820px)  { #grid { columns: 3; } }
  @media (max-width: 540px)  { #grid { columns: 2; } }
  #grid a {
    display: block; position: relative; break-inside: avoid;
    margin: 0 0 6px; border-radius: 8px; overflow: hidden;
    background: var(--card); border: 1px solid var(--line);
  }
  #grid img { width: 100%; display: block; }
  #grid .badge {
    position: absolute; top: 5px; right: 5px;
    background: #000b; color: #fff; font-size: 11px;
    padding: 1px 6px; border-radius: 7px;
  }
  .empty, .loading { color: var(--sub); text-align: center; padding: 40px 16px; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>📌 ブックマーク画像</h1>
    <span class="updated" id="updated"></span>
  </div>
  <div id="tabs"></div>
</header>
<main>
  <div id="grid"><div class="loading">読み込み中…</div></div>
</main>
<script>
  var tabs = document.getElementById('tabs');
  var grid = document.getElementById('grid');
  var updatedEl = document.getElementById('updated');
  var DATA = {};

  function render(folder) {
    var items = DATA[folder] || [];
    if (!items.length) { grid.innerHTML = '<div class="empty">この分類は空です</div>'; }
    else {
      grid.innerHTML = items.map(function (d) {
        var tw = 'https://x.com/' + d.h + '/status/' + d.id;
        var thumb = d.u[0] + (d.u[0].indexOf('?') === -1 ? '?name=small' : '');
        var badge = d.n > 1 ? '<div class="badge">+' + (d.n - 1) + '</div>' : '';
        return '<a href="' + tw + '" target="_blank" rel="noreferrer noopener">' +
               '<img loading="lazy" src="' + thumb + '" alt="">' + badge + '</a>';
      }).join('');
    }
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.className = b.dataset.f === folder ? 'on' : '';
    });
    window.scrollTo(0, 0);
  }

  fetch('data.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (payload) {
      DATA = payload.data || {};
      if (payload.updatedAt) {
        var d = new Date(payload.updatedAt);
        updatedEl.textContent = '更新: ' + d.toLocaleString('ja-JP');
      }
      var folders = Object.keys(DATA).filter(function (f) { return DATA[f] && DATA[f].length; });
      if (!folders.length) { grid.innerHTML = '<div class="empty">まだデータがありません。整理ルーチンの初回反映をお待ちください。</div>'; return; }
      tabs.innerHTML = '';
      folders.forEach(function (f) {
        var b = document.createElement('button');
        b.textContent = f + ' (' + DATA[f].length + ')';
        b.dataset.f = f;
        b.onclick = function () { render(f); };
        tabs.appendChild(b);
      });
      render(folders[0]);
    })
    .catch(function (e) {
      grid.innerHTML = '<div class="empty">データを読み込めませんでした: ' + e.message + '</div>';
    });
</script>
</body>
</html>
