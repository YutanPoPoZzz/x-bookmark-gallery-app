<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Xブックマーク画像ギャラリー</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #14161a; --card: #1a1d22; --ink: #e9ebee;
    --sub: #8a919c; --line: #262a31; --accent: #4bb3c9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px 8px;
  }
  .title { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 8px; }
  .title h1 { font-size: 1.02rem; margin: 0; letter-spacing: .01em; }
  .title .updated { color: var(--sub); font-size: .74rem; }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  #tabs button {
    background: var(--panel); color: var(--sub);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; font-size: .82rem; cursor: pointer;
    font-family: inherit; transition: background .12s, color .12s, border-color .12s;
  }
  #tabs button:hover { color: var(--ink); }
  #tabs button.on { background: var(--accent); color: #04252c; border-color: var(--accent); font-weight: 700; }
  main { padding: 8px; }
  #grid { columns: 5; column-gap: 6px; }
  @media (max-width: 1100px) { #grid { columns: 4; } }
  @media (max-width: 820px)  { #grid { columns: 3; } }
  @media (max-width: 540px)  { #grid { columns: 2; } }
  #grid a {
    display: block; position: relative; break-inside: avoid;
    margin: 0 0 6px; border-radius: 8px; overflow: hidden;
    background: var(--card); border: 1px solid var(--line);
  }
  #grid img { width: 100%; display: block; }
  #grid .badge {
    position: absolute; top: 5px; right: 5px;
    background: #000b; color: #fff; font-size: 11px;
    padding: 1px 6px; border-radius: 7px;
  }
  .empty, .loading { color: var(--sub); text-align: center; padding: 40px 16px; font-size: .9rem; }

  /* --- 保存先チップ / 保存済みマーク / トースト --- */
  #dest {
    background: none; border: 1px solid var(--line); color: var(--sub);
    border-radius: 999px; padding: 3px 10px; font-size: .7rem;
    font-family: inherit; cursor: pointer; margin-left: auto;
  }
  #dest:hover { color: var(--ink); border-color: var(--accent); }
  #dest.set { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  #grid a.saved { outline: 2px solid var(--accent); outline-offset: -2px; }
  #grid .saved-mark {
    position: absolute; top: 5px; left: 5px;
    background: var(--accent); color: #04252c; font-size: 11px; font-weight: 700;
    padding: 1px 6px; border-radius: 7px;
  }
  #grid a.busy { opacity: .45; }
  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 200; max-width: min(92vw, 520px);
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 14px; font-size: .82rem; line-height: 1.5;
    box-shadow: 0 8px 24px #0009;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-left-color: #e2748a; }

  /* --- 合言葉ゲート --- */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  /* ID指定の display:flex は UA の [hidden]{display:none} に勝ってしまうので明示的に消す */
  #gate[hidden] { display: none; }
  #gate .box { width: 100%; max-width: 340px; text-align: center; }
  #gate h2 { font-size: 1.05rem; margin: 0 0 6px; font-weight: 700; }
  #gate p { color: var(--sub); font-size: .78rem; line-height: 1.6; margin: 0 0 18px; }
  #gate input {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; text-align: center;
  }
  #gate input:focus { outline: none; border-color: var(--accent); }
  #gate button {
    width: 100%; margin-top: 10px; padding: 12px; font-size: .92rem; font-family: inherit;
    background: var(--accent); color: #04252c; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer;
  }
  #gate button:disabled { opacity: .5; cursor: default; }
  #gate .msg { min-height: 1.3em; margin-top: 12px; font-size: .8rem; color: #e2748a; }
  #gate .msg.working { color: var(--sub); }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>📌 ブックマーク画像</h2>
    <p>データは暗号化して置いてあります。<br>合言葉を入れると復号されます。</p>
    <input id="pass" type="password" inputmode="text" autocomplete="current-password" placeholder="合言葉">
    <button id="unlock">ひらく</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<header hidden id="head">
  <div class="title">
    <h1>📌 ブックマーク画像</h1>
    <span class="updated" id="updated"></span>
    <button id="dest" title="右クリックで画像を保存する先のフォルダ">保存先: 未設定</button>
  </div>
  <div id="tabs"></div>
</header>
<main hidden id="body">
  <div id="grid"><div class="loading">読み込み中…</div></div>
</main>
<div id="toast"></div>

<script>
  var STORE_KEY = 'xbm-gallery-pass';
  var tabs = document.getElementById('tabs');
  var grid = document.getElementById('grid');
  var updatedEl = document.getElementById('updated');
  var gate = document.getElementById('gate');
  var passEl = document.getElementById('pass');
  var btn = document.getElementById('unlock');
  var msg = document.getElementById('msg');
  var DATA = {};
  var ENC = null;
  var CUR = null;   // 表示中のフォルダ名
  var SAVED = {};   // 保存済みツイートID

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function gunzip(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('このブラウザは gzip 展開に未対応です'));
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }

  function decrypt(enc, passphrase) {
    var te = new TextEncoder();
    return crypto.subtle
      .importKey('raw', te.encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: b64ToBytes(enc.kdf.salt),
            iterations: enc.kdf.iterations,
            hash: enc.kdf.hash,
          },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(enc.iv) }, key, b64ToBytes(enc.ct));
      })
      .then(function (plain) {
        var bytes = new Uint8Array(plain);
        return enc.gzip ? gunzip(bytes) : bytes;
      })
      .then(function (bytes) {
        return JSON.parse(new TextDecoder().decode(bytes));
      });
  }

  function render(folder) {
    CUR = folder;
    var items = DATA[folder] || [];
    if (!items.length) { grid.innerHTML = '<div class="empty">この分類は空です</div>'; }
    else {
      grid.innerHTML = items.map(function (d, i) {
        var tw = 'https://x.com/' + d.h + '/status/' + d.id;
        var thumb = d.u[0] + (d.u[0].indexOf('?') === -1 ? '?name=small' : '');
        var badge = d.n > 1 ? '<div class="badge">+' + (d.n - 1) + '</div>' : '';
        var done = SAVED[d.id] ? ' saved' : '';
        var mark = SAVED[d.id] ? '<div class="saved-mark">保存済</div>' : '';
        return '<a class="' + done.trim() + '" data-idx="' + i + '" href="' + tw + '" target="_blank" rel="noreferrer noopener">' +
               '<img loading="lazy" src="' + thumb + '" alt="">' + badge + mark + '</a>';
      }).join('');
    }
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.className = b.dataset.f === folder ? 'on' : '';
    });
    window.scrollTo(0, 0);
  }

  /* ===== 右クリックで リファレンスフォルダ に保存 ===== */

  var DEST_NAME = 'リファレンス';          // 保存先として認めるフォルダ名
  var IDB_NAME = 'xbm-gallery';
  var IDB_STORE = 'handles';
  var SAVED_KEY = 'xbm-gallery-saved';
  var destHandle = null;
  var destBtn = document.getElementById('dest');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  try { SAVED = JSON.parse(localStorage.getItem(SAVED_KEY) || '{}'); } catch (e) { SAVED = {}; }

  function toast(text, isError) {
    toastEl.textContent = text;
    toastEl.className = 'show' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, isError ? 6000 : 2600);
  }

  // ディレクトリハンドルは IndexedDB にしか入れられない(localStorage は不可)
  function idb(mode, fn) {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
      req.onerror = function () { reject(req.error); };
      req.onsuccess = function () {
        var db = req.result;
        var tx = db.transaction(IDB_STORE, mode);
        var out = fn(tx.objectStore(IDB_STORE));
        tx.oncomplete = function () { db.close(); resolve(out && out.result); };
        tx.onerror = function () { db.close(); reject(tx.error); };
      };
    });
  }

  function setDestLabel() {
    if (destHandle) {
      destBtn.textContent = '保存先: ' + destHandle.name;
      destBtn.className = 'set';
    } else {
      destBtn.textContent = '保存先: 未設定';
      destBtn.className = '';
    }
  }

  // pick=true なら選択ダイアログを出す。false は記憶済みハンドルの復帰のみ。
  async function ensureDest(pick) {
    if (typeof window.showDirectoryPicker !== 'function') {
      throw new Error('このブラウザはフォルダへの保存に対応していません（PCのChrome / Edge を使ってください）');
    }
    if (!destHandle) {
      try { destHandle = await idb('readonly', function (s) { return s.get('dest'); }); } catch (e) { destHandle = null; }
    }
    if (destHandle) {
      var perm = await destHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        perm = await destHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') {
          throw new Error('フォルダへの書き込みが許可されませんでした。もう一度右クリックして「編集を許可」を選んでください');
        }
      }
      setDestLabel();
      return destHandle;
    }
    if (!pick) {
      throw new Error('保存先が未設定です。右上の「保存先」ボタンから ' + DEST_NAME + ' フォルダを選んでください');
    }
    var picked;
    try {
      picked = await window.showDirectoryPicker({ id: 'xbm-ref', mode: 'readwrite', startIn: 'pictures' });
    } catch (e) {
      throw new Error('フォルダが選ばれませんでした');
    }
    if (picked.name !== DEST_NAME) {
      throw new Error('「' + DEST_NAME + '」フォルダを選んでください（選ばれたのは「' + picked.name + '」です）');
    }
    destHandle = picked;
    try { await idb('readwrite', function (s) { s.put(picked, 'dest'); }); } catch (e) {}
    setDestLabel();
    return destHandle;
  }

  function origUrl(u) { return u.split('?')[0] + '?name=orig'; }

  function fileNameFor(item, url, i) {
    var m = /\.([a-z0-9]{3,4})(?:$|\?)/i.exec(url.split('?')[0]);
    var ext = m ? m[1].toLowerCase() : 'jpg';
    var suffix = i > 0 ? '_' + (i + 1) : '';
    return item.h + '_' + item.id + suffix + '.' + ext;
  }

  async function saveItem(item, card) {
    var dir = await ensureDest(false);
    var urls = item.u || [];
    var saved = 0;
    for (var i = 0; i < urls.length; i++) {
      var url = origUrl(urls[i]);
      var res = await fetch(url, { mode: 'cors', cache: 'no-store' });
      if (!res.ok) throw new Error('画像を取得できませんでした（HTTP ' + res.status + '）');
      var blob = await res.blob();
      var fh = await dir.getFileHandle(fileNameFor(item, urls[i], i), { create: true });
      var w = await fh.createWritable();
      await w.write(blob);
      await w.close();
      saved++;
    }
    if (!saved) throw new Error('この投稿には保存できる画像がありません');
    SAVED[item.id] = 1;
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(SAVED)); } catch (e) {}
    if (card) {
      card.classList.add('saved');
      if (!card.querySelector('.saved-mark')) {
        var mk = document.createElement('div');
        mk.className = 'saved-mark';
        mk.textContent = '保存済';
        card.appendChild(mk);
      }
    }
    return saved;
  }

  destBtn.addEventListener('click', function () {
    ensureDest(true)
      .then(function (d) { toast('保存先を ' + d.name + ' に設定しました。画像を右クリックで保存できます'); })
      .catch(function (e) { toast(e.message, true); });
  });

  grid.addEventListener('contextmenu', function (ev) {
    var card = ev.target.closest && ev.target.closest('a[data-idx]');
    if (!card) return;
    // Shift+右クリック はブラウザ標準のメニューを出す(逃げ道)
    if (ev.shiftKey) return;
    if (typeof window.showDirectoryPicker !== 'function') {
      toast('このブラウザはフォルダへの保存に対応していません（PCのChrome / Edge を使ってください）', true);
      return; // 標準メニューは出したままにする
    }
    ev.preventDefault();
    if (card.classList.contains('busy')) return;
    var item = (DATA[CUR] || [])[Number(card.dataset.idx)];
    if (!item) { toast('画像の情報を取得できませんでした', true); return; }
    card.classList.add('busy');
    saveItem(item, card)
      .then(function (n) { toast(n > 1 ? n + '枚を ' + DEST_NAME + ' に保存しました' : DEST_NAME + ' に保存しました'); })
      .catch(function (e) { toast('保存に失敗: ' + e.message, true); })
      .then(function () { card.classList.remove('busy'); });
  });

  // 記憶済みハンドルがあればラベルだけ先に出す(許可の確認は保存時)
  idb('readonly', function (s) { return s.get('dest'); })
    .then(function (h) { if (h) { destHandle = h; setDestLabel(); } })
    .catch(function () {});

  function show(payload) {
    DATA = payload || {};
    gate.hidden = true;
    document.getElementById('head').hidden = false;
    document.getElementById('body').hidden = false;
    if (ENC && ENC.updatedAt) {
      updatedEl.textContent = '更新: ' + new Date(ENC.updatedAt).toLocaleString('ja-JP');
    }
    var folders = Object.keys(DATA).filter(function (f) { return DATA[f] && DATA[f].length; });
    if (!folders.length) { grid.innerHTML = '<div class="empty">まだデータがありません。</div>'; return; }
    tabs.innerHTML = '';
    folders.forEach(function (f) {
      var b = document.createElement('button');
      b.textContent = f + ' (' + DATA[f].length + ')';
      b.dataset.f = f;
      b.onclick = function () { render(f); };
      tabs.appendChild(b);
    });
    render(folders[0]);
  }

  function tryUnlock(passphrase, silent) {
    btn.disabled = true;
    msg.className = 'msg working';
    msg.textContent = '復号中…';
    return decrypt(ENC, passphrase)
      .then(function (data) {
        try { localStorage.setItem(STORE_KEY, passphrase); } catch (e) {}
        show(data);
      })
      .catch(function (e) {
        try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
        btn.disabled = false;
        msg.className = 'msg';
        // AES-GCM の認証タグ不一致 = 合言葉違い。それ以外は素のメッセージを出す。
        msg.textContent = /operation-specific reason|OperationError|^$/.test(e.message || '')
          ? '合言葉が違います'
          : 'エラー: ' + e.message;
        if (!silent) passEl.focus();
      });
  }

  btn.onclick = function () {
    var v = passEl.value.trim();
    if (!v) { passEl.focus(); return; }
    tryUnlock(v, false);
  };
  passEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.onclick(); });

  btn.disabled = true;
  msg.className = 'msg working';
  msg.textContent = 'データ取得中…';
  fetch('data.enc.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (enc) {
      ENC = enc;
      btn.disabled = false;
      msg.className = 'msg';
      msg.textContent = '';
      var saved = null;
      try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
      if (saved) return tryUnlock(saved, true);
      passEl.focus();
    })
    .catch(function (e) {
      msg.className = 'msg';
      msg.textContent = 'データを読み込めませんでした: ' + e.message;
    });
</script>
</body>
</html>
