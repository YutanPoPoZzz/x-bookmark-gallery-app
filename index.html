<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- 非公開URLのホスト名を pbs.twimg.com に渡さない -->
<meta name="referrer" content="no-referrer">
<title>Xブックマーク</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #14161a; --card: #1a1d22; --ink: #e9ebee;
    --sub: #8a919c; --line: #262a31; --accent: #4bb3c9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px 8px;
  }
  .title { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 8px; }
  .title h1 { font-size: 1.02rem; margin: 0; letter-spacing: .01em; }
  .title .updated { color: var(--sub); font-size: .74rem; }

  /* --- セクション切替(画像 / テキスト / ウォッチ) ---
     狭い画面ではセクションのピルが縮まないので、検索欄を同じ行に置くと
     検索欄だけが 41px まで潰れる。行を分ける。 */
  .bar { display: flex; gap: 8px; align-items: center; padding-bottom: 8px; flex-wrap: wrap; }
  #secs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  #secs button {
    background: none; color: var(--sub); border: none; border-radius: 999px;
    padding: 5px 14px; font-size: .8rem; font-family: inherit; cursor: pointer;
    white-space: nowrap; transition: background .12s, color .12s;
  }
  #secs button:hover { color: var(--ink); }
  #secs button.on { background: var(--accent); color: #04252c; font-weight: 700; }
  #q {
    flex: 1; min-width: 0;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; font-size: .82rem; font-family: inherit;
  }
  #q:focus { outline: none; border-color: var(--accent); }
  /* 狭い画面ではセクションのピルが縮まないので、同じ行だと検索欄だけが 41px まで潰れる。
     ここは #q の flex 指定より後に置くこと(先に置くと flex:1 の basis:0 に負ける)。 */
  @media (max-width: 700px) {
    #q { flex: 1 1 100%; order: 3; }
  }

  /* 折り返すとフォルダ12個で 179px ぶんヘッダーが伸び、画面の1/3を食う。1行にして横スクロールする */
  #tabs {
    display: flex; flex-wrap: nowrap; gap: 6px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    margin: 0 -12px; padding: 0 12px 2px;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: 0 0 auto; }
  #tabs button {
    background: var(--panel); color: var(--sub);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; font-size: .82rem; cursor: pointer;
    font-family: inherit; transition: background .12s, color .12s, border-color .12s;
  }
  #tabs button:hover { color: var(--ink); }
  #tabs button.on { background: var(--accent); color: #04252c; border-color: var(--accent); font-weight: 700; }
  #tabs.dim button.on { background: var(--panel); color: var(--sub); border-color: var(--line); font-weight: 400; }

  main { padding: 8px; }
  .hits { color: var(--sub); font-size: .78rem; padding: 2px 4px 8px; }

  /* --- 画像 / ウォッチ: マソンリー --- */
  #grid { columns: 5; column-gap: 6px; }
  @media (max-width: 1100px) { #grid { columns: 4; } }
  @media (max-width: 820px)  { #grid { columns: 3; } }
  @media (max-width: 540px)  { #grid { columns: 2; } }
  #grid a {
    display: block; position: relative; break-inside: avoid;
    margin: 0 0 6px; border-radius: 8px; overflow: hidden;
    background: var(--card); border: 1px solid var(--line);
    /* 画面外のカードはレイアウトを確定させない。3,400件でも描画が一定に保たれる */
    content-visibility: auto; contain-intrinsic-size: 0 240px;
  }
  #grid img { width: 100%; display: block; background: var(--panel); }
  #grid .badge {
    position: absolute; top: 5px; right: 5px;
    background: #000b; color: #fff; font-size: 11px;
    padding: 1px 6px; border-radius: 7px;
  }
  #grid .when {
    position: absolute; left: 5px; bottom: 5px;
    background: #000b; color: #dfe3e8; font-size: 10px;
    padding: 1px 6px; border-radius: 7px;
  }
  #grid .where {
    position: absolute; right: 5px; bottom: 5px;
    background: #000b; color: #dfe3e8; font-size: 10px;
    padding: 1px 6px; border-radius: 7px;
  }

  /* --- テキスト: 読む前提のカード --- */
  #list { display: grid; gap: 8px; grid-template-columns: 1fr; }
  @media (min-width: 900px)  { #list { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1500px) { #list { grid-template-columns: 1fr 1fr 1fr; } }
  .tcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px 9px; display: flex; flex-direction: column; gap: 7px;
    /* line-clamp を全件ぶん確定させると 1,200件で 242ms かかる。画面外は後回しにする */
    content-visibility: auto; contain-intrinsic-size: 0 200px;
  }
  .tmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .72rem; color: var(--sub); }
  .tmeta .hand { color: var(--accent); }
  .tmeta .fold {
    border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; line-height: 1.5;
  }
  .ttext {
    margin: 0; font-size: .86rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .ttext.clip {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer;
  }
  .ttext mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink); border-radius: 3px; }
  .tlinks { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: .71rem; color: var(--sub); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--accent); }
  .topen {
    align-self: flex-start; font-size: .72rem; color: var(--sub); text-decoration: none;
    margin-top: auto; padding-top: 2px;
  }
  .topen:hover { color: var(--accent); }

  .empty, .loading { color: var(--sub); text-align: center; padding: 40px 16px; font-size: .9rem; }

  /* --- 保存先チップ / 保存済みマーク / トースト --- */
  #dest {
    background: none; border: 1px solid var(--line); color: var(--sub);
    border-radius: 999px; padding: 3px 10px; font-size: .7rem;
    font-family: inherit; cursor: pointer; margin-left: auto;
  }
  #dest:hover { color: var(--ink); border-color: var(--accent); }
  #dest.set { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  #grid a.saved { outline: 2px solid var(--accent); outline-offset: -2px; }
  #grid .saved-mark {
    position: absolute; top: 5px; left: 5px;
    background: var(--accent); color: #04252c; font-size: 11px; font-weight: 700;
    padding: 1px 6px; border-radius: 7px;
  }
  #grid a.busy { opacity: .45; }
  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 200; max-width: min(92vw, 520px);
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 14px; font-size: .82rem; line-height: 1.5;
    box-shadow: 0 8px 24px #0009;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-left-color: #e2748a; }

  /* --- 合言葉ゲート --- */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  /* ID指定の display:flex は UA の [hidden]{display:none} に勝ってしまうので明示的に消す */
  #gate[hidden] { display: none; }
  #gate .box { width: 100%; max-width: 340px; text-align: center; }
  #gate h2 { font-size: 1.05rem; margin: 0 0 6px; font-weight: 700; }
  #gate p { color: var(--sub); font-size: .78rem; line-height: 1.6; margin: 0 0 18px; }
  #gate input {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; text-align: center;
  }
  #gate input:focus { outline: none; border-color: var(--accent); }
  #gate button {
    width: 100%; margin-top: 10px; padding: 12px; font-size: .92rem; font-family: inherit;
    background: var(--accent); color: #04252c; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer;
  }
  #gate button:disabled { opacity: .5; cursor: default; }
  #gate .msg { min-height: 1.3em; margin-top: 12px; font-size: .8rem; color: #e2748a; }
  #gate .msg.working { color: var(--sub); }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>📌 ブックマーク</h2>
    <p>データは暗号化して置いてあります。<br>合言葉を入れると復号されます。</p>
    <input id="pass" type="password" inputmode="text" autocomplete="current-password" placeholder="合言葉">
    <button id="unlock">ひらく</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<header hidden id="head">
  <div class="title">
    <h1>📌 ブックマーク</h1>
    <span class="updated" id="updated"></span>
    <button id="dest" title="右クリックで画像を保存する先のフォルダ">保存先: 未設定</button>
  </div>
  <div class="bar">
    <div id="secs"></div>
    <input id="q" type="search" placeholder="検索" autocomplete="off">
  </div>
  <div id="tabs"></div>
</header>
<main hidden id="body">
  <div class="hits" id="hits" hidden></div>
  <div id="grid"><div class="loading">読み込み中…</div></div>
  <div id="list" hidden></div>
</main>
<div id="toast"></div>

<script>
  var STORE_KEY = 'xbm-gallery-pass';
  var VIEW_KEY = 'xbm-gallery-view';
  var tabs = document.getElementById('tabs');
  var secsEl = document.getElementById('secs');
  var grid = document.getElementById('grid');
  var list = document.getElementById('list');
  var hitsEl = document.getElementById('hits');
  var qEl = document.getElementById('q');
  var updatedEl = document.getElementById('updated');
  var gate = document.getElementById('gate');
  var passEl = document.getElementById('pass');
  var btn = document.getElementById('unlock');
  var msg = document.getElementById('msg');

  var PAY = {};       // { img: {folder:[...]}, text: {...}, watch: {...} }
  var ENC = null;
  var SEC = 'img';    // 表示中のセクション
  var CUR = null;     // 表示中のフォルダ名 / ハンドル
  var SHOWN = [];     // いま画面に並んでいる item(検索結果を含む)。data-idx はこの配列を指す
  var SAVED = {};     // 保存済みツイートID

  var SECTIONS = [
    { key: 'img',   label: '画像',     ph: '@ハンドルで検索' },
    { key: 'text',  label: 'テキスト', ph: '本文・URL・@ハンドルで検索' },
    { key: 'watch', label: 'ウォッチ', ph: '@ハンドルで検索' }
  ];

  /* ===== 文字列の安全化(本文は他人が書いたテキストなので必ず通す) ===== */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }
  function host(u) {
    try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; }
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function gunzip(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('このブラウザは gzip 展開に未対応です'));
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }

  function decrypt(enc, passphrase) {
    var te = new TextEncoder();
    return crypto.subtle
      .importKey('raw', te.encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: b64ToBytes(enc.kdf.salt),
            iterations: enc.kdf.iterations,
            hash: enc.kdf.hash,
          },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(enc.iv) }, key, b64ToBytes(enc.ct));
      })
      .then(function (plain) {
        var bytes = new Uint8Array(plain);
        return enc.gzip ? gunzip(bytes) : bytes;
      })
      .then(function (bytes) {
        return JSON.parse(new TextDecoder().decode(bytes));
      });
  }

  /* ===== データの読み取り ===== */

  // v2 は {v:2, img, text, watch}。それ以前は素の {フォルダ名: [...]} なので img として扱う。
  function normalize(payload) {
    if (payload && payload.v === 2) {
      return { img: payload.img || {}, text: payload.text || {}, watch: payload.watch || {} };
    }
    return { img: payload || {}, text: {}, watch: {} };
  }

  function sectionData() { return PAY[SEC] || {}; }
  function tabNames() {
    var d = sectionData();
    return Object.keys(d).filter(function (k) { return d[k] && d[k].length; });
  }
  function sectionCount(key) {
    var d = PAY[key] || {}, n = 0;
    Object.keys(d).forEach(function (k) { n += (d[k] || []).length; });
    return n;
  }

  /* ===== 検索 ===== */

  function haystack(it) {
    // 画像・ウォッチは本文を持たないので、拾えるのはハンドルだけ
    return ('@' + (it.h || '') + ' ' + (it.t || '') + ' ' + ((it.l || []).join(' '))).toLowerCase();
  }

  function searchAll(q) {
    var needle = q.toLowerCase();
    var d = sectionData(), out = [];
    Object.keys(d).forEach(function (folder) {
      (d[folder] || []).forEach(function (it) {
        if (haystack(it).indexOf(needle) !== -1) out.push({ it: it, folder: folder });
      });
    });
    return out;
  }

  // 表示されるのは冒頭4行(約90字)だけなので、ヒットがその外なら手前から始める
  var SNIPPET_HEAD = 70;

  /**
   * 一致箇所を全部ハイライトする。
   * 位置決めは必ず「生の文字列」で行い、esc() は切り出した断片ごとに掛ける。
   * エスケープ済みの文字列上で探すと &amp;quot; のような実体参照の内側に <mark> が刺さって本文が化ける。
   */
  function highlight(text, q) {
    var raw = String(text == null ? '' : text);
    if (!q) return esc(raw);
    var hay = raw.toLowerCase();
    var needle = q.toLowerCase();
    var first = hay.indexOf(needle);
    if (first === -1) return esc(raw);

    // 最初のヒットがクランプの外なら、その手前まで送って「…」を付ける
    var from = 0, prefix = '';
    if (first > SNIPPET_HEAD) {
      from = first - Math.floor(SNIPPET_HEAD / 2);
      prefix = '…';
    }
    var body = raw.slice(from);
    var lower = body.toLowerCase();
    var out = prefix, at = 0, i;
    while ((i = lower.indexOf(needle, at)) !== -1) {
      out += esc(body.slice(at, i)) + '<mark>' + esc(body.substr(i, q.length)) + '</mark>';
      at = i + q.length;
    }
    return out + esc(body.slice(at));
  }

  /* ===== 描画 ===== */

  // 画像は X の CDN のものだけ扱う。右クリック保存がローカルにファイルを書くので、
  // 「表示できる」より一段厳しく絞る(拡張子は URL のパスから取っているため)。
  function twimgUrl(u) {
    return /^https:\/\/pbs\.twimg\.com\//.test(u || '') ? u : null;
  }

  function imgCard(d, i, folder) {
    var src = twimgUrl((d.u || [])[0]);
    if (!src) return '';
    var tw = 'https://x.com/' + encodeURIComponent(d.h || 'i') + '/status/' + encodeURIComponent(d.id);
    var thumb = src + (src.indexOf('?') === -1 ? '?name=small' : '');
    var badge = d.n > 1 ? '<div class="badge">+' + (d.n - 1) + '</div>' : '';
    var when = d.d ? '<div class="when">' + esc(d.d) + '</div>' : '';
    var where = folder ? '<div class="where">' + esc(folder) + '</div>' : '';
    var done = SAVED[d.id] ? ' saved' : '';
    var mark = SAVED[d.id] ? '<div class="saved-mark">保存済</div>' : '';
    // 縦横比が判っていれば先に枠を確保する(画像が届くたびに列が組み替わるのを防ぐ)
    var ratio = (typeof d.r === 'number' && d.r > 0.05 && d.r < 20)
      ? ' style="aspect-ratio:1/' + d.r + '"' : '';
    return '<a class="' + done.trim() + '" data-idx="' + i + '" href="' + esc(safeUrl(tw)) + '" target="_blank" rel="noreferrer noopener">' +
           '<img loading="lazy"' + ratio + ' src="' + esc(thumb) + '" alt="">' + badge + when + where + mark + '</a>';
  }

  function textCard(d, q, folder) {
    var tw = 'https://x.com/' + encodeURIComponent(d.h || 'i') + '/status/' + encodeURIComponent(d.id);
    var meta = '<span class="hand">@' + esc(d.h || '?') + '</span>';
    if (d.d) meta += '<span>' + esc(d.d) + '</span>';
    if (folder) meta += '<span class="fold">' + esc(folder) + '</span>';
    var links = (d.l || []).map(function (u) {
      var label = host(u);
      if (!label) return '';   // javascript: 等はラベルが空になる。空のピルを並べない
      return '<a class="chip" href="' + esc(safeUrl(u)) + '" target="_blank" rel="noreferrer noopener">' + esc(label) + '</a>';
    }).join('');
    return '<article class="tcard">' +
             '<div class="tmeta">' + meta + '</div>' +
             '<p class="ttext clip" title="クリックで全文">' + highlight(d.t || '', q) + '</p>' +
             (links ? '<div class="tlinks">' + links + '</div>' : '') +
             '<a class="topen" href="' + esc(safeUrl(tw)) + '" target="_blank" rel="noreferrer noopener">元ツイート ↗</a>' +
           '</article>';
  }

  function render() {
    var q = qEl.value.trim();
    var rows;      // [{it, folder}]
    if (q) {
      rows = searchAll(q);
      hitsEl.hidden = false;
      hitsEl.textContent = '「' + q + '」: ' + rows.length + '件（' + secLabel(SEC) + 'の全フォルダ）';
      tabs.className = 'dim';
    } else {
      rows = (sectionData()[CUR] || []).map(function (it) { return { it: it, folder: null }; });
      hitsEl.hidden = true;
      tabs.className = '';
    }
    SHOWN = rows.map(function (r) { return r.it; });

    var isText = SEC === 'text';
    grid.hidden = isText;
    list.hidden = !isText;
    var target = isText ? list : grid;
    // 使わない側は空にする。残すと画像1万件とテキスト1万件が同時に生き、
    // iOS Safari がメモリ圧でタブごと捨てる(=合言葉からやり直しになる)
    (isText ? grid : list).innerHTML = '';

    if (!rows.length) {
      target.innerHTML = '<div class="empty">' + (q ? '見つかりませんでした' : 'ここは空です') + '</div>';
    } else if (isText) {
      target.innerHTML = rows.map(function (r) { return textCard(r.it, q, r.folder); }).join('');
    } else {
      target.innerHTML = rows.map(function (r, i) { return imgCard(r.it, i, r.folder); }).join('');
    }

    Array.prototype.forEach.call(tabs.children, function (b) {
      b.className = b.dataset.f === CUR ? 'on' : '';
    });
  }

  /** 表示位置の記憶。検索の毎打鍵で同期I/Oを叩かないよう render とは分ける */
  function rememberView() {
    try { localStorage.setItem(VIEW_KEY, JSON.stringify({ sec: SEC, cur: CUR })); } catch (e) {}
  }

  function secLabel(key) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].key === key) return SECTIONS[i].label;
    return key;
  }

  function buildTabs() {
    var names = tabNames();
    tabs.innerHTML = '';
    names.forEach(function (f) {
      var b = document.createElement('button');
      b.textContent = (SEC === 'watch' ? '@' : '') + f + ' (' + sectionData()[f].length + ')';
      b.dataset.f = f;
      b.onclick = function () { CUR = f; qEl.value = ''; render(); rememberView(); };
      tabs.appendChild(b);
    });
    if (names.indexOf(CUR) === -1) CUR = names[0] || null;
  }

  function setSection(key) {
    SEC = key;
    qEl.value = '';
    for (var i = 0; i < SECTIONS.length; i++) {
      if (SECTIONS[i].key === key) qEl.placeholder = SECTIONS[i].ph;
    }
    Array.prototype.forEach.call(secsEl.children, function (b) {
      b.className = b.dataset.s === key ? 'on' : '';
    });
    buildTabs();
    render();
    rememberView();
    window.scrollTo(0, 0);
  }

  function buildSections() {
    secsEl.innerHTML = '';
    SECTIONS.forEach(function (s) {
      var n = sectionCount(s.key);
      if (!n) return;                       // 空のセクションはボタンごと出さない
      var b = document.createElement('button');
      b.textContent = s.label + ' ' + n;
      b.dataset.s = s.key;
      b.onclick = function () { setSection(s.key); };
      secsEl.appendChild(b);
    });
  }

  // 本文はクリックで全文表示に切り替える(200字までなので展開しても短い)
  list.addEventListener('click', function (ev) {
    var p = ev.target.closest && ev.target.closest('.ttext');
    if (p) p.classList.toggle('clip');
  });

  var qTimer = null;
  qEl.addEventListener('input', function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(render, 140);
  });

  /* ===== 右クリックで リファレンスフォルダ に保存 ===== */

  var DEST_NAME = 'リファレンス';          // 保存先として認めるフォルダ名
  var IDB_NAME = 'xbm-gallery';
  var IDB_STORE = 'handles';
  var SAVED_KEY = 'xbm-gallery-saved';
  var destHandle = null;
  var destBtn = document.getElementById('dest');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  try { SAVED = JSON.parse(localStorage.getItem(SAVED_KEY) || '{}'); } catch (e) { SAVED = {}; }

  function toast(text, isError) {
    toastEl.textContent = text;
    toastEl.className = 'show' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, isError ? 6000 : 2600);
  }

  // ディレクトリハンドルは IndexedDB にしか入れられない(localStorage は不可)
  function idb(mode, fn) {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
      req.onerror = function () { reject(req.error); };
      req.onsuccess = function () {
        var db = req.result;
        var tx = db.transaction(IDB_STORE, mode);
        var out = fn(tx.objectStore(IDB_STORE));
        tx.oncomplete = function () { db.close(); resolve(out && out.result); };
        tx.onerror = function () { db.close(); reject(tx.error); };
      };
    });
  }

  function setDestLabel() {
    if (destHandle) {
      destBtn.textContent = '保存先: ' + destHandle.name;
      destBtn.className = 'set';
    } else {
      destBtn.textContent = '保存先: 未設定';
      destBtn.className = '';
    }
  }

  // pick=true なら選択ダイアログを出す。false は記憶済みハンドルの復帰のみ。
  async function ensureDest(pick) {
    if (typeof window.showDirectoryPicker !== 'function') {
      throw new Error('このブラウザはフォルダへの保存に対応していません（PCのChrome / Edge を使ってください）');
    }
    if (!destHandle) {
      try { destHandle = await idb('readonly', function (s) { return s.get('dest'); }); } catch (e) { destHandle = null; }
    }
    if (destHandle) {
      var perm = await destHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        perm = await destHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') {
          throw new Error('フォルダへの書き込みが許可されませんでした。もう一度右クリックして「編集を許可」を選んでください');
        }
      }
      setDestLabel();
      return destHandle;
    }
    if (!pick) {
      throw new Error('保存先が未設定です。右上の「保存先」ボタンから ' + DEST_NAME + ' フォルダを選んでください');
    }
    var picked;
    try {
      picked = await window.showDirectoryPicker({ id: 'xbm-ref', mode: 'readwrite', startIn: 'pictures' });
    } catch (e) {
      throw new Error('フォルダが選ばれませんでした');
    }
    if (picked.name !== DEST_NAME) {
      throw new Error('「' + DEST_NAME + '」フォルダを選んでください（選ばれたのは「' + picked.name + '」です）');
    }
    destHandle = picked;
    try { await idb('readwrite', function (s) { s.put(picked, 'dest'); }); } catch (e) {}
    setDestLabel();
    return destHandle;
  }

  function origUrl(u) { return u.split('?')[0] + '?name=orig'; }

  function fileNameFor(item, url, i) {
    var m = /\.([a-z0-9]{3,4})(?:$|\?)/i.exec(url.split('?')[0]);
    var ext = m ? m[1].toLowerCase() : 'jpg';
    var suffix = i > 0 ? '_' + (i + 1) : '';
    return item.h + '_' + item.id + suffix + '.' + ext;
  }

  async function saveItem(item, card) {
    var dir = await ensureDest(false);
    // ローカルにファイルを書くので、X の CDN 以外は触らない
    // (拡張子を URL のパスから取っているため、別ホストを許すと任意の拡張子で保存されうる)
    var urls = (item.u || []).filter(twimgUrl);
    var saved = 0;
    for (var i = 0; i < urls.length; i++) {
      var url = origUrl(urls[i]);
      var res = await fetch(url, { mode: 'cors', cache: 'no-store' });
      if (!res.ok) throw new Error('画像を取得できませんでした（HTTP ' + res.status + '）');
      var blob = await res.blob();
      var fh = await dir.getFileHandle(fileNameFor(item, urls[i], i), { create: true });
      var w = await fh.createWritable();
      await w.write(blob);
      await w.close();
      saved++;
    }
    if (!saved) throw new Error('この投稿には保存できる画像がありません');
    SAVED[item.id] = 1;
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(SAVED)); } catch (e) {}
    if (card) {
      card.classList.add('saved');
      if (!card.querySelector('.saved-mark')) {
        var mk = document.createElement('div');
        mk.className = 'saved-mark';
        mk.textContent = '保存済';
        card.appendChild(mk);
      }
    }
    return saved;
  }

  // File System Access API が無い環境(iOS Safari / Android Chrome)ではボタン自体を出さない
  if (typeof window.showDirectoryPicker !== 'function') destBtn.hidden = true;

  destBtn.addEventListener('click', function () {
    ensureDest(true)
      .then(function (d) { toast('保存先を ' + d.name + ' に設定しました。画像を右クリックで保存できます'); })
      .catch(function (e) { toast(e.message, true); });
  });

  grid.addEventListener('contextmenu', function (ev) {
    var card = ev.target.closest && ev.target.closest('a[data-idx]');
    if (!card) return;
    // Shift+右クリック はブラウザ標準のメニューを出す(逃げ道)
    if (ev.shiftKey) return;
    if (typeof window.showDirectoryPicker !== 'function') {
      toast('このブラウザはフォルダへの保存に対応していません（PCのChrome / Edge を使ってください）', true);
      return; // 標準メニューは出したままにする
    }
    ev.preventDefault();
    if (card.classList.contains('busy')) return;
    var item = SHOWN[Number(card.dataset.idx)];
    if (!item) { toast('画像の情報を取得できませんでした', true); return; }
    card.classList.add('busy');
    saveItem(item, card)
      .then(function (n) { toast(n > 1 ? n + '枚を ' + DEST_NAME + ' に保存しました' : DEST_NAME + ' に保存しました'); })
      .catch(function (e) { toast('保存に失敗: ' + e.message, true); })
      .then(function () { card.classList.remove('busy'); });
  });

  // 記憶済みハンドルがあればラベルだけ先に出す(許可の確認は保存時)
  idb('readonly', function (s) { return s.get('dest'); })
    .then(function (h) { if (h) { destHandle = h; setDestLabel(); } })
    .catch(function () {});

  function show(payload) {
    PAY = normalize(payload);
    gate.hidden = true;
    document.getElementById('head').hidden = false;
    document.getElementById('body').hidden = false;
    if (ENC && ENC.updatedAt) {
      updatedEl.textContent = '更新: ' + new Date(ENC.updatedAt).toLocaleString('ja-JP');
    }
    buildSections();
    if (!secsEl.children.length) {
      grid.innerHTML = '<div class="empty">まだデータがありません。</div>';
      return;
    }
    // 前回見ていた場所に戻す(無ければ先頭のセクション)
    var want = null;
    try { want = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch (e) {}
    var first = secsEl.children[0].dataset.s;
    if (want && sectionCount(want.sec)) { CUR = want.cur; setSection(want.sec); }
    else setSection(first);
  }

  function tryUnlock(passphrase, silent) {
    btn.disabled = true;
    msg.className = 'msg working';
    msg.textContent = '復号中…';
    return decrypt(ENC, passphrase)
      .then(function (data) {
        try { localStorage.setItem(STORE_KEY, passphrase); } catch (e) {}
        show(data);
      })
      .catch(function (e) {
        try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
        btn.disabled = false;
        msg.className = 'msg';
        // AES-GCM の認証タグ不一致 = 合言葉違い。それ以外は素のメッセージを出す。
        msg.textContent = /operation-specific reason|OperationError|^$/.test(e.message || '')
          ? '合言葉が違います'
          : 'エラー: ' + e.message;
        if (!silent) passEl.focus();
      });
  }

  btn.onclick = function () {
    var v = passEl.value.trim();
    if (!v) { passEl.focus(); return; }
    tryUnlock(v, false);
  };
  passEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.onclick(); });

  btn.disabled = true;
  msg.className = 'msg working';
  msg.textContent = 'データ取得中…';
  fetch('data.enc.json', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('データが取得できません（HTTP ' + r.status + '）');
      return r.json();
    })
    .then(function (enc) {
      ENC = enc;
      btn.disabled = false;
      msg.className = 'msg';
      msg.textContent = '';
      var saved = null;
      try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
      if (saved) { passEl.value = saved; return tryUnlock(saved, true); }
      passEl.focus();
    })
    .catch(function (e) {
      msg.className = 'msg';
      msg.textContent = e.message;
    });
</script>
</body>
</html>
